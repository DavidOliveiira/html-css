<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border: 1px solid black;
            border-collapse: collapse;
            margin: 0 auto
            
        }
        th{
            border: 1px solid black;
            padding: 0.5vw 3vw;
            padding-top: ;
            background-color: lightgrey;
        }
        td{
            border: 1px solid black;
            padding: 1vw;
        }
        h1{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Desafio do Boletim Escolar</h1>
    <table>
        <thead>
            <tr>
                <th scope="col" rowspan="2">Área</th>
                <th scope="col" rowspan="2">Disciplinas</th>
                <th scope="colgroup" colspan="2">Notas</th>
                <th scope="col" rowspan="2">Média</th>
                
            </tr>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="rowgroup" style="background-color: white;" rowspan="4">Exatas</th>
                <td>Matémática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th scope="row" style="text-align: left;" colspan="4">Média de Exatas</th>
                <td style="background-color: lightgrey; color: rgb(255, 255, 255);" ><strong>0.0</strong></td>
            </tr>
            <tr>
                <th scope="rowgroup" style="background-color: white;" rowspan="2">Humanas</th>
                <td>Historia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th scope="rowgroup" style="text-align: left;" colspan="4">Média de Humanas</th>
                <td style="background-color: lightgrey; color: rgb(255, 255, 255);" ><strong>0.0</strong></td>
            </tr>
        </tbody>
        
    </table>
</body>
</html>
