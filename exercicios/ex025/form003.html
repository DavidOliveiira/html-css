<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de Formuário</h1>
    <p>
        <label for="inome">Nome</label>
        <input type="text" name="Nome" id="inome"        required maxlength="30"> 
    </p>

    <p>
        <label for="imedia">Média</label>
        <input type="number" name="media" id="imedia" min="0" max="10" placeholder="0 a 10" step="0.1" required>
    </p>

    <p>
        <label for="imes">Período Letivo</label>
        <input type="month" name="mes" id="imes">
    </p>

    <p>
        <label for="iprova">Dia da Prova</label>
        <input type="date" name="Prova" id="iprova">
    </p>

    <p>
        <label for="ihora">Horário da prova</label>
        <input type="time" name="hora" id="ihora">
    </p>

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
</body>
</html>
